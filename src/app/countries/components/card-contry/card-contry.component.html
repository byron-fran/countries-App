<div>
    @if (isFavorite())
    {
    <p-button severity="secondary" (click)="onDeleteFavorite(country?.cca3!)">
        <i class="pi pi-heart-fill text-pink-600  "></i>
    </p-button>
    }
    @else {
    <p-button severity="secondary" (click)="onAddFavorite()">
        <i class="pi pi-heart text-pink-600  "></i>
    </p-button>
    }
   
    <img [routerLink]="['/country/', country?.cca3]" class="mx-auto w-[200px] h-[150px] object-contain cursor-pointer"
        [src]="country?.flags?.png" [alt]="country?.name?.common">
     <h2 class="text-center">{{country?.name?.common }}</h2>   
</div>
